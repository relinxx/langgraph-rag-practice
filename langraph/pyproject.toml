    "langchainhub (>=0.1.21,<0.2.0)",
    "chromadb (>=1.0.15,<2.0.0)",
    "langchain (>=0.3.27,<0.4.0)",
    "langgraph (>=0.5.4,<0.6.0)",
    "tavily-python (>=0.7.10,<0.8.0)",
    "gpt4all (>=2.8.2,<3.0.0)",
    "fastembed (>=0.7.1,<0.8.0)",
    "langchain-groq (>=0.3.6,<0.4.0)",
    "transformers (>=4.54.0,<5.0.0)",
    "docx (>=0.2.4,<0.3.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "fitz (>=0.0.1.dev2,<0.0.2)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "langchain-ollama (>=0.3.6,<0.4.0)"
