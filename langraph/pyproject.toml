[project]
name = "langraph"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = "=3.12.11"
dependencies = [
    "langchain-nomic (>=0.1.4,<0.2.0)",
    "langchain-community (>=0.3.27,<0.4.0)",
